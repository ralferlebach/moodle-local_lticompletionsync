name: Playwright syntax check

# The end-to-end story in tests/playwright needs the two-site stack (platform A, tool B) that is not available on
# GitHub runners. This workflow therefore only syntax-checks the specs; execution is done on the local stack.
# See docs/TESTING.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/playwright/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check (every spec, helper and config; list in package.json "check")
        working-directory: tests/playwright
        run: npm run check
